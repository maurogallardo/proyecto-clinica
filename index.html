<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <!-- Para que la página se vea bien en el celular (sin achicarse) -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proyecto Clínica</title>

  <!-- PWA: la "ficha de identidad" que permite instalar la app en el celular -->
  <link rel="manifest" href="manifest.webmanifest">
  <!-- Color de la barra superior del celular -->
  <meta name="theme-color" content="#0f4c81">
  <!-- Ícono de la pestaña del navegador -->
  <link rel="icon" type="image/png" href="assets/iconos/icono-192.png">
  <!-- iPhone: no usa los íconos del manifest, necesita el suyo y su nombre -->
  <link rel="apple-touch-icon" href="assets/iconos/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="Clínica">

  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <!-- Contenido provisorio: acá van a ir las pantallas de carga y dashboard -->
  <h1>Proyecto Clínica</h1>
  <p>En construcción.</p>

  <script src="js/app.js"></script>
</body>
</html>
