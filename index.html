<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <!-- Ajustada al ancho del celular y SIN zoom con los dedos (decisión del proyecto).
       Android lo respeta; el iPhone lo ignora, por eso hay refuerzos en
       css/estilos.css y js/sin-zoom.js -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Sanatorio de la Cañada</title>

  <!-- PWA: la "ficha de identidad" que permite instalar la app en el celular -->
  <link rel="manifest" href="manifest.webmanifest">
  <!-- Color de la barra superior del celular (js/tema.js lo ajusta según el modo) -->
  <meta name="theme-color" content="#E7F2F1">
  <!-- Ícono de la pestaña del navegador -->
  <link rel="icon" type="image/png" href="assets/iconos/icono-192.png">
  <!-- iPhone: no usa los íconos del manifest, necesita el suyo y su nombre -->
  <link rel="apple-touch-icon" href="assets/iconos/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="De la Cañada">

  <!-- Tokens: todos los colores, formas y tiempos de la app -->
  <link rel="stylesheet" href="css/tokens.css">
  <!-- Modo claro/oscuro: va antes de dibujar la página, para que no parpadee -->
  <script src="js/tema.js"></script>

  <!-- Tipografía Albert Sans (guía visual, sección 5) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600;700&display=swap">

  <link rel="stylesheet" href="css/estilos.css">
  <link rel="stylesheet" href="css/splash.css">
  <link rel="stylesheet" href="css/login.css">
  <link rel="stylesheet" href="css/carga.css">
</head>
<body>
  <!-- Splash (T047): visible desde el primer instante; js/splash.js lo cambia a los 2,5 s -->
  <section id="splash" class="pantalla">
    <div class="splash__escena">
      <div class="splash__halo"></div>
      <img class="splash__logo solo-tema-claro" src="assets/logos/logo-completo.svg"
           alt="Sanatorio de la Cañada - Sanatorio Privado Río Tercero">
      <img class="splash__logo solo-tema-oscuro" src="assets/logos/logo-completo-claro.svg"
           alt="Sanatorio de la Cañada - Sanatorio Privado Río Tercero">
    </div>
  </section>

  <!-- Login (T048): copia del de LoMar. Sin "crear cuenta": el alta la hace el administrador -->
  <section id="login" class="pantalla" hidden>
    <div class="login__contenedor">
      <img class="login__logo solo-tema-claro" src="assets/logos/logo-completo.svg"
           alt="Sanatorio de la Cañada - Sanatorio Privado Río Tercero">
      <img class="login__logo solo-tema-oscuro" src="assets/logos/logo-completo-claro.svg"
           alt="Sanatorio de la Cañada - Sanatorio Privado Río Tercero">
      <h1 class="login__titulo">Iniciar sesión</h1>

      <form class="login__tarjeta" id="login-formulario" novalidate>
        <label class="login__etiqueta" for="login-correo">Correo electrónico</label>
        <input class="login__campo" type="email" id="login-correo" autocomplete="username"
               inputmode="email" autocapitalize="off" spellcheck="false">

        <label class="login__etiqueta" for="login-contrasena">Contraseña</label>
        <div class="login__contrasena">
          <input class="login__campo" type="password" id="login-contrasena" autocomplete="current-password">
          <button type="button" class="login__ojito" id="login-ver-contrasena" aria-label="Mostrar contraseña">
            <svg class="ojo-icono" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
              <circle class="ojo-pupila" cx="12" cy="12" r="3" />
              <line class="ojo-raya" x1="4" y1="4" x2="20" y2="20" />
            </svg>
          </button>
        </div>

        <button type="submit" class="login__boton" id="login-entrar">Entrar</button>
        <p class="login__error" id="login-error" role="alert" hidden></p>
      </form>
    </div>
  </section>

  <!-- Carga del Estudio Ergométrico (T013). El formulario lo dibuja js/carga.js
       a partir de la planilla (js/planillas/ergometrico.js). -->
  <section id="carga" class="pantalla" hidden>
    <header class="encabezado">
      <h1 class="encabezado__titulo">Estudio ergométrico</h1>
      <div class="encabezado__derecha">
        <img class="encabezado__isologo solo-tema-claro" src="assets/logos/isologo.svg" alt="Sanatorio de la Cañada">
        <img class="encabezado__isologo solo-tema-oscuro" src="assets/logos/isologo-claro.svg" alt="Sanatorio de la Cañada">
        <button type="button" class="encabezado__menu" id="menu-boton"
                aria-label="Menú" aria-expanded="false" aria-controls="menu-panel">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <circle cx="12" cy="5" r="2" /><circle cx="12" cy="12" r="2" /><circle cx="12" cy="19" r="2" />
          </svg>
        </button>
      </div>

      <div class="menu" id="menu-panel" hidden>
        <p class="menu__correo">Ingresaste como <strong id="menu-correo"></strong></p>
        <p class="menu__rotulo">Modo de color</p>
        <div class="selector-tema" role="group" aria-label="Modo de color">
          <button type="button" data-modo="claro">Claro</button>
          <button type="button" data-modo="oscuro">Oscuro</button>
          <button type="button" data-modo="auto">Automático</button>
        </div>
        <button type="button" class="boton-secundario" id="boton-cerrar-sesion">Cerrar sesión</button>
      </div>
    </header>

    <main class="carga" id="carga-formulario"></main>
  </section>

  <!-- Librería oficial de Supabase: versión fija y con "huella digital" (integrity):
       si el archivo del CDN fuera alterado, el navegador se niega a usarlo. -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.1/dist/umd/supabase.js"
          integrity="sha384-K1nraABOP/zFehpLIUksXebbs7jMpB8gYMlb+uhVKZcWT/9Vkq1+qhv6ndC+1Yuz"
          crossorigin="anonymous"></script>
  <script src="js/sin-zoom.js"></script>
  <script src="js/config.js"></script>
  <script src="js/sesion.js"></script>
  <script src="js/pantallas.js"></script>
  <script src="js/planillas/ergometrico.js"></script>
  <script src="js/formulario.js"></script>
  <script src="js/carga.js"></script>
  <script src="js/login.js"></script>
  <script src="js/splash.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
