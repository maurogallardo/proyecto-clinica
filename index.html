<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <!-- Ajustada al ancho del celular y SIN zoom con los dedos (decisión del proyecto).
       Android lo respeta; el iPhone lo ignora, por eso hay refuerzos en
       css/estilos.css y js/sin-zoom.js -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Sanatorio de la Cañada</title>

  <!-- PWA: la "ficha de identidad" que permite instalar la app en el celular -->
  <link rel="manifest" href="manifest.webmanifest">
  <!-- Color de la barra superior del celular (js/tema.js lo ajusta según el modo) -->
  <meta name="theme-color" content="#E7F2F1">
  <!-- Ícono de la pestaña del navegador -->
  <link rel="icon" type="image/png" href="assets/iconos/icono-192.png">
  <!-- iPhone: no usa los íconos del manifest, necesita el suyo y su nombre -->
  <link rel="apple-touch-icon" href="assets/iconos/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="De la Cañada">

  <!-- Tokens: todos los colores, formas y tiempos de la app -->
  <link rel="stylesheet" href="css/tokens.css">
  <!-- Modo claro/oscuro: va antes de dibujar la página, para que no parpadee -->
  <script src="js/tema.js"></script>

  <!-- Tipografía Albert Sans (guía visual, sección 5) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600;700&display=swap">

  <link rel="stylesheet" href="css/estilos.css">
  <link rel="stylesheet" href="css/splash.css">
  <link rel="stylesheet" href="css/login.css">
  <link rel="stylesheet" href="css/carga.css">
  <link rel="stylesheet" href="css/cartel.css">
  <link rel="stylesheet" href="css/barra-voz.css">
  <link rel="stylesheet" href="css/avisos.css">
</head>
<body>
  <!-- Splash (T047): visible desde el primer instante; js/splash.js lo cambia a los 2,5 s -->
  <section id="splash" class="pantalla">
    <div class="splash__escena">
      <div class="splash__halo"></div>
      <img class="splash__logo solo-tema-claro" src="assets/logos/logo-completo.svg"
           alt="Sanatorio de la Cañada - Sanatorio Privado Río Tercero">
      <img class="splash__logo solo-tema-oscuro" src="assets/logos/logo-completo-claro.svg"
           alt="Sanatorio de la Cañada - Sanatorio Privado Río Tercero">
    </div>
  </section>

  <!-- Login (T048): copia del de LoMar. Sin "crear cuenta": el alta la hace el administrador -->
  <section id="login" class="pantalla" hidden>
    <div class="login__contenedor">
      <img class="login__logo solo-tema-claro" src="assets/logos/logo-completo.svg"
           alt="Sanatorio de la Cañada - Sanatorio Privado Río Tercero">
      <img class="login__logo solo-tema-oscuro" src="assets/logos/logo-completo-claro.svg"
           alt="Sanatorio de la Cañada - Sanatorio Privado Río Tercero">
      <h1 class="login__titulo">Iniciar sesión</h1>

      <form class="login__tarjeta" id="login-formulario" novalidate>
        <label class="login__etiqueta" for="login-correo">Correo electrónico</label>
        <input class="login__campo" type="email" id="login-correo" autocomplete="username"
               inputmode="email" autocapitalize="off" spellcheck="false">

        <label class="login__etiqueta" for="login-contrasena">Contraseña</label>
        <div class="login__contrasena">
          <input class="login__campo" type="password" id="login-contrasena" autocomplete="current-password">
          <button type="button" class="login__ojito" id="login-ver-contrasena" aria-label="Mostrar contraseña">
            <svg class="ojo-icono" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
              <circle class="ojo-pupila" cx="12" cy="12" r="3" />
              <line class="ojo-raya" x1="4" y1="4" x2="20" y2="20" />
            </svg>
          </button>
        </div>

        <button type="submit" class="login__boton" id="login-entrar">Entrar</button>
        <p class="login__error" id="login-error" role="alert" hidden></p>
      </form>
    </div>
  </section>

  <!-- Carga del Estudio Ergométrico (T013). El formulario lo dibuja js/carga.js
       a partir de la planilla (js/planillas/ergometrico.js). -->
  <section id="carga" class="pantalla" hidden>
    <header class="encabezado">
      <h1 class="encabezado__titulo">Estudio ergométrico</h1>
      <div class="encabezado__derecha">
        <img class="encabezado__isologo solo-tema-claro" src="assets/logos/isologo.svg" alt="Sanatorio de la Cañada">
        <img class="encabezado__isologo solo-tema-oscuro" src="assets/logos/isologo-claro.svg" alt="Sanatorio de la Cañada">
        <button type="button" class="encabezado__menu" id="menu-boton"
                aria-label="Menú" aria-expanded="false" aria-controls="menu-panel">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <circle cx="12" cy="5" r="2" /><circle cx="12" cy="12" r="2" /><circle cx="12" cy="19" r="2" />
          </svg>
        </button>
      </div>

      <div class="menu" id="menu-panel" hidden>
        <p class="menu__correo">Ingresaste como <strong id="menu-correo"></strong></p>
        <p class="menu__rotulo">Modo de color</p>
        <div class="selector-tema" role="group" aria-label="Modo de color">
          <button type="button" data-modo="claro">Claro</button>
          <button type="button" data-modo="oscuro">Oscuro</button>
          <button type="button" data-modo="auto">Automático</button>
        </div>
        <button type="button" class="boton-secundario" id="boton-cerrar-sesion">Cerrar sesión</button>
      </div>
    </header>

    <!-- Solo esta caja se desplaza; el encabezado queda quieto arriba (como en LoMar).
         Así ningún campo pasa por detrás del encabezado. -->
    <div class="carga__desplazable">
      <main class="carga" id="carga-formulario"></main>
    </div>

    <!-- Guía del candado (T015): aparece arriba del micrófono mientras se graba -->
    <div class="guia-candado" id="guia-candado" aria-hidden="true">
      <div class="guia-candado__circulo" id="guia-candado-circulo">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <rect x="5" y="11" width="14" height="9" rx="2" />
          <path d="M8 11V7a4 4 0 0 1 8 0v4" />
        </svg>
      </div>
      <span class="guia-candado__texto">Deslizá arriba para trabar</span>
    </div>

    <!-- Barra de voz (T015): copia de la barra de grabación de LoMar (js/grabacion.js) -->
    <div class="barra-voz" id="barra-voz">
      <div class="barra-voz__adjuntos">
        <button type="button" class="boton-redondo" id="boton-adjuntar" aria-label="Adjuntar imagen">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48" />
          </svg>
        </button>
        <button type="button" class="boton-redondo" id="boton-camara" aria-label="Sacar foto">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z" />
            <circle cx="12" cy="13" r="4" />
          </svg>
        </button>
      </div>

      <div class="barra-voz__izquierda">
        <span class="barra-voz__pista" id="pista-cancelar" hidden>← Deslizá para cancelar</span>
        <button type="button" class="boton-redondo boton-redondo--descartar" id="boton-descartar-grabacion"
                aria-label="Descartar grabación" hidden>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="3 6 5 6 21 6" /><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6" />
            <path d="M10 11v6" /><path d="M14 11v6" /><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2" />
          </svg>
        </button>
        <span class="barra-voz__tiempo numeros" id="tiempo-grabacion" hidden>00:00</span>
      </div>

      <canvas class="barra-voz__onda" id="onda" aria-hidden="true"></canvas>

      <div class="barra-voz__derecha">
        <button type="button" class="microfono" id="microfono"
                aria-label="Mantené apretado para grabar. Deslizá arriba para trabar o a la izquierda para cancelar">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z" />
            <path d="M19 10v2a7 7 0 0 1-14 0v-2" />
            <line x1="12" y1="19" x2="12" y2="23" /><line x1="8" y1="23" x2="16" y2="23" />
          </svg>
        </button>

        <!-- Con candado: pausar / seguir y enviar (descartar va a la izquierda) -->
        <div class="barra-voz__controles" id="controles-trabado" hidden>
          <button type="button" class="boton-redondo" id="boton-pausar" aria-label="Pausar o seguir grabando">
            <svg id="icono-pausar" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <rect x="6" y="4" width="4" height="16" /><rect x="14" y="4" width="4" height="16" />
            </svg>
            <svg id="icono-seguir" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" hidden>
              <polygon points="6 3 20 12 6 21" />
            </svg>
          </button>
          <button type="button" class="boton-redondo boton-redondo--enviar" id="boton-enviar-grabacion" aria-label="Enviar grabación">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <line x1="22" y1="2" x2="11" y2="13" /><polygon points="22 2 15 22 11 13 2 9 22 2" />
            </svg>
          </button>
        </div>

        <!-- Vista previa: descartar, escuchar y enviar -->
        <div class="barra-voz__controles" id="controles-vista-previa" hidden>
          <button type="button" class="boton-redondo boton-redondo--descartar" id="boton-descartar-audio" aria-label="Descartar audio">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <polyline points="3 6 5 6 21 6" /><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6" />
              <path d="M10 11v6" /><path d="M14 11v6" /><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2" />
            </svg>
          </button>
          <button type="button" class="boton-redondo" id="boton-escuchar" aria-label="Escuchar o pausar el audio">
            <svg id="icono-escuchar" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <polygon points="6 3 20 12 6 21" />
            </svg>
            <svg id="icono-pausar-escucha" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" hidden>
              <rect x="6" y="4" width="4" height="16" /><rect x="14" y="4" width="4" height="16" />
            </svg>
          </button>
          <button type="button" class="boton-redondo boton-redondo--enviar" id="boton-enviar-audio" aria-label="Enviar audio">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <line x1="22" y1="2" x2="11" y2="13" /><polygon points="22 2 15 22 11 13 2 9 22 2" />
            </svg>
          </button>
        </div>
      </div>
    </div>

    <audio id="audio-vista-previa" hidden></audio>
  </section>

  <!-- Cartel de confirmación (js/cartel.js). Uno solo para toda la app. -->
  <div class="cartel-velo" id="cartel" hidden>
    <div class="cartel" role="alertdialog" aria-modal="true"
         aria-labelledby="cartel-titulo" aria-describedby="cartel-texto">
      <h2 class="cartel__titulo" id="cartel-titulo"></h2>
      <p class="cartel__texto" id="cartel-texto"></p>
      <div class="cartel__acciones">
        <button type="button" class="cartel__boton cartel__boton--secundario" id="cartel-volver">Volver</button>
        <button type="button" class="cartel__boton cartel__boton--primario" id="cartel-confirmar">Aceptar</button>
      </div>
    </div>
  </div>

  <!-- Aviso corto (toast) de toda la app (js/avisos.js) -->
  <div class="aviso" id="aviso" role="status" aria-live="polite" hidden>
    <span id="aviso-texto"></span>
  </div>

  <!-- Librería oficial de Supabase: versión fija y con "huella digital" (integrity):
       si el archivo del CDN fuera alterado, el navegador se niega a usarlo. -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.1/dist/umd/supabase.js"
          integrity="sha384-K1nraABOP/zFehpLIUksXebbs7jMpB8gYMlb+uhVKZcWT/9Vkq1+qhv6ndC+1Yuz"
          crossorigin="anonymous"></script>
  <script src="js/sin-zoom.js"></script>
  <script src="js/config.js"></script>
  <script src="js/sesion.js"></script>
  <script src="js/pantallas.js"></script>
  <script src="js/planillas/ergometrico.js"></script>
  <script src="js/cartel.js"></script>
  <script src="js/formulario.js"></script>
  <script src="js/carga.js"></script>
  <script src="js/avisos.js"></script>
  <script src="js/onda.js"></script>
  <script src="js/dictado.js"></script>
  <script src="js/grabacion.js"></script>
  <script src="js/login.js"></script>
  <script src="js/splash.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
